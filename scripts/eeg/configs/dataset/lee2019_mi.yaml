# Lee 2019 MI: 54 subjects, 2 classes, 62 channels.
# Band-pass 8-32 Hz, 128 Hz, one sample covariance per trial. Split: 75 / 10 / 15 %
# of the trials, stratified by class (spdnet-train needs a validation set).
name: moabb
dataset: Lee2019_MI
paradigm: MotorImagery
paradigm_params:
  n_classes: 2
  events: [left_hand, right_hand]
  fmin: 8.0
  fmax: 32.0
  resample: 128
  tmin: 0.0
  tmax: 4.0
input_dim: 62
estimator: scm
split_strategy: stratified
holdout: [0.1, 0.15]
seed: ${seed}  # split seed: the run seed
batch_size: 32
num_workers: 0
