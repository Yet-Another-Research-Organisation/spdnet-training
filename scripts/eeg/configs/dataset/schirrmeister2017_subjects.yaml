# Schirrmeister 2017 (High-Gamma): 14 subjects, 4 classes, 128 channels.
# Cross-subject protocol: 14 folds subject_fold_<k>. Fold k tests one subject,
# validates on the next two and trains on the others. Each session of a
# validation or test subject is cut in recording order: its first half is the
# unlabeled calibration of the batch norm, its second half is evaluated.
# One Optuna study and one run per fold (run_optuna_eeg.sh, run_eeg.sh).
name: moabb
dataset: Schirrmeister2017
paradigm: MotorImagery
paradigm_params:
  n_classes: 4
  events: [left_hand, right_hand, feet, rest]
  fmin: 8.0
  fmax: 32.0
  resample: 128
  tmin: 0.0
  tmax: null
input_dim: 128
estimator: scm
split_strategy: subject_fold_0  # replaced by the scripts, one fold per run
subject_folds: 14
val_groups: 2  # validation subjects of each fold
fold_seed: 0  # subject groups, the same in every run
calib_fraction: 0.5
calib_sizes: [0, 4, 8, 16, 32, null]  # K of the test; 0: no adaptation, null: whole pool
seed: ${seed}  # run seed: initialisation and batch order
batch_size: 32
num_workers: 0
